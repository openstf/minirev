version: v1.0
name: Android
agent:
  machine:
    type: e2-standard-4
    os_image: ubuntu2204
blocks:
  - name: Gradle
    task:
      jobs:
        - name: Build
          commands:
            - checkout
            - git submodule init
            - git submodule update
            - sem-version java 11
            - export ANDROID_SDK_ROOT=~/android-sdk
            - export ANDROID_HOME=~/android-sdk
            - mkdir -p ~/android-sdk/cmdline-tools
            - wget -q https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -O ~/android-commandline-tools.zip
            - unzip -q ~/android-commandline-tools.zip -d ~/android-sdk/cmdline-tools
            - export PATH=$PATH:~/android-sdk/cmdline-tools/latest/bin
            - yes | sdkmanager --licenses > /dev/null 2>&1
            - sdkmanager "ndk;27.0.11718014"
            - export PATH=$PATH:~/android-sdk/ndk/27.0.11718014
            - ndk-build
